name: Build fonts

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ttfautohint woff2

      - name: Install AFDKO
        run: pip install afdko

      - name: Build
        run: make TOOLS= otf ttf woff2

      - uses: actions/upload-artifact@v4
        with:
          name: et-book-fonts
          path: |
            build/otf/*.otf
            build/ttf/*.ttf
            build/woff2/*.woff2

      - name: Attach fonts to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -j et-book-${{ github.ref_name }}.zip \
            build/otf/*.otf build/ttf/*.ttf build/woff2/*.woff2 dist/et-book.css
          gh release create ${{ github.ref_name }} --generate-notes \
            et-book-${{ github.ref_name }}.zip
